<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Order</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=imgview1" />
</head>
<body class="records-page order-view-page">
  <nav class="app-nav no-print">
    <div class="app-nav-links">
      <a class="app-nav-link" href="index.html">Order Questionnaire</a>
      <a class="app-nav-link is-active" href="records.html">Order Records</a>
    </div>
    <div class="nav-user" id="nav-user" hidden>
      <span id="nav-who"></span>
      <button type="button" class="ghost-btn" id="logout-btn">Log out</button>
    </div>
  </nav>

  <div class="page order-view-shell" id="order-view-print">
    <header class="order-view-header">
      <div class="order-view-heading">
        <a class="order-view-back no-print" href="records.html">← Back to Order Records</a>
        <h1 id="order-view-title">Order</h1>
        <p class="order-view-meta" id="order-view-meta"></p>
      </div>
      <div class="order-view-toolbar no-print">
        <button type="button" class="order-view-btn order-view-btn-outline" id="order-view-pdf">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download PDF
        </button>
        <a class="order-view-btn order-view-btn-outline" id="order-view-edit" href="records.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit Order
        </a>
      </div>
    </header>
    <div class="order-view-body" id="order-view-body">
      <div class="empty-state"><strong>Loading order…</strong></div>
    </div>
  </div>

  <script src="js/storage.js?v=revsub15"></script>
  <script src="js/sheet-sync.js?v=revsub15"></script>
  <script src="js/auth.js?v=revsub15"></script>
  <script src="js/order-view.js?v=imgview1"></script>
</body>
</html>
