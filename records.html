<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Records</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=revprog1" />
</head>
<body class="records-page">
  <nav class="app-nav">
    <div class="app-nav-links">
      <a class="app-nav-link" href="index.html">Order Questionnaire</a>
      <a class="app-nav-link is-active" href="records.html">Order Records</a>
    </div>
    <div class="nav-user" id="nav-user" hidden>
      <span id="nav-who"></span>
      <button type="button" class="ghost-btn" id="logout-btn">Log out</button>
    </div>
  </nav>

  <div class="page records-shell">
    <header class="records-header">
      <div>
        <h1>Order Records</h1>
        <p>Saved questionnaires, revision history, and approval status</p>
      </div>
      <p class="records-count" id="records-count">0 orders</p>
    </header>

    <div class="records-tabs" role="tablist" aria-label="Order status">
      <button type="button" class="records-tab is-active" role="tab" id="tab-in-progress" data-tab="in-progress" aria-selected="true">
        New order has to be placed
        <span class="records-tab-count" data-tab-count="in-progress">0</span>
      </button>
      <button type="button" class="records-tab" role="tab" id="tab-on-revision" data-tab="on-revision" aria-selected="false">
        On revision
        <span class="records-tab-count" data-tab-count="on-revision">0</span>
      </button>
      <button type="button" class="records-tab" role="tab" id="tab-ready-to-approve" data-tab="ready-to-approve" aria-selected="false">
        Ready to Approve
        <span class="records-tab-count" data-tab-count="ready-to-approve">0</span>
      </button>
      <button type="button" class="records-tab" role="tab" id="tab-completed" data-tab="completed" aria-selected="false">
        Completed
        <span class="records-tab-count" data-tab-count="completed">0</span>
      </button>
    </div>

    <section class="records-filters" aria-label="Filter orders">
      <label class="records-field records-field-search">
        <span>Search</span>
        <input type="search" id="records-search" placeholder="Order ID, Fiverr ID, name, message, or requirements" />
      </label>
      <label class="records-field">
        <span>Date</span>
        <input type="date" id="filter-date" />
      </label>
      <label class="records-field admin-only" id="filter-account-field">
        <span>Account</span>
        <select id="filter-account">
          <option value="">All accounts</option>
        </select>
      </label>
      <label class="records-field">
        <span>Payment</span>
        <select id="filter-payment">
          <option value="">All payment statuses</option>
          <option value="paid">Paid</option>
          <option value="unpaid">Unpaid</option>
        </select>
      </label>
      <label class="records-field">
        <span>Revision</span>
        <select id="filter-revision">
          <option value="">All revisions</option>
          <option value="pending">Revision Pending</option>
          <option value="completed">Completed revision</option>
          <option value="none">No revisions</option>
        </select>
      </label>
      <label class="records-field">
        <span>Ready to approve</span>
        <select id="filter-ready">
          <option value="">All approval states</option>
          <option value="yes">Ready to Approve</option>
          <option value="no">Not Ready</option>
        </select>
      </label>
    </section>

    <div class="records-table-wrap">
      <table class="records-table">
        <thead>
          <tr id="records-head-row"></tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
    </div>
  </div>

  <div class="chat-drawer" id="chat-drawer" hidden>
    <div class="chat-drawer-backdrop" data-close-chat></div>
    <aside class="chat-drawer-panel" role="dialog" aria-modal="true" aria-labelledby="chat-drawer-title">
      <header class="chat-drawer-head">
        <div class="live-chat-head-copy">
          <p class="chat-drawer-kicker">Conversation</p>
          <h2 id="chat-drawer-title">Chat</h2>
          <p class="live-chat-head-sub" id="chat-drawer-sub"></p>
        </div>
        <button type="button" class="chat-drawer-close" data-close-chat aria-label="Close chat">×</button>
      </header>
      <div class="chat-drawer-body" id="chat-drawer-body"></div>
    </aside>
  </div>

  <div class="chat-lightbox" id="chat-lightbox" hidden>
    <div class="chat-lightbox-backdrop" data-close-lightbox></div>
    <figure class="chat-lightbox-panel">
      <img id="chat-lightbox-image" alt="" />
      <figcaption class="chat-lightbox-bar">
        <span id="chat-lightbox-name"></span>
        <button type="button" class="chat-file-btn" id="chat-lightbox-save">Save image</button>
        <button type="button" class="chat-drawer-close" data-close-lightbox aria-label="Close preview">×</button>
      </figcaption>
    </figure>
  </div>

  <div class="chat-drawer" id="rev-history-drawer" hidden>
    <div class="chat-drawer-backdrop" data-close-rev-history></div>
    <aside class="chat-drawer-panel rev-history-panel" role="dialog" aria-modal="true" aria-labelledby="rev-history-title">
      <header class="chat-drawer-head">
        <div class="live-chat-head-copy">
          <p class="chat-drawer-kicker">Revision history</p>
          <h2 id="rev-history-title">Revisions</h2>
          <p class="live-chat-head-sub" id="rev-history-sub"></p>
        </div>
        <button type="button" class="chat-drawer-close" data-close-rev-history aria-label="Close revision history">×</button>
      </header>
      <div class="chat-drawer-body rev-history-body" id="rev-history-body"></div>
    </aside>
  </div>

  <div class="rev-complete-pop" id="rev-complete-pop" hidden>
    <p id="rev-complete-copy">Mark revision as completed</p>
    <div class="rev-complete-actions">
      <button type="button" class="rev-complete-btn is-primary" id="rev-complete-yes">Mark as Completed</button>
      <button type="button" class="rev-complete-btn" data-close-complete-pop>Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/storage.js?v=statustab2"></script>
  <script src="js/sheet-sync.js?v=statustab2"></script>
  <script src="js/auth.js?v=names1"></script>
  <script src="js/records.js?v=norevcols1"></script>
</body>
</html>
